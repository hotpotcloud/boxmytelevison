name: Deploy to Tencent Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_DIR: /opt/boxmytelevison

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          STANDALONE_BUILD: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package standalone
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$APP_PASSWORD" || { echo '::error::APP_PASSWORD is empty'; exit 1; }
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          cp deploy/server.env .next/standalone/.env
          cp deploy/start.cjs .next/standalone/start.cjs
          cp deploy/start.sh .next/standalone/start.sh
          # Send only the version and official checksum; Node itself is downloaded on the server.
          node --version > .next/standalone/.node-version
          node_archive="node-$(node --version)-linux-x64.tar.xz"
          curl -fsSL --retry 2 --connect-timeout 15 --max-time 60 \
            "https://nodejs.org/dist/$(node --version)/SHASUMS256.txt" \
            | awk -v name="$node_archive" '$2 == name {print $1}' > .next/standalone/.node-sha256
          test "$(wc -c < .next/standalone/.node-sha256)" -eq 65
          # JSON preserves special characters without interpreting the password as shell code.
          node -e 'require("fs").writeFileSync(".next/standalone/password.json", JSON.stringify({password: process.env.APP_PASSWORD}), {mode: 0o600})'
          tar -czf app.tar.gz -C .next/standalone .
          sha256sum app.tar.gz > app.tar.gz.sha256
          # The package contains a secret: transfer it only over SSH, never publish it.

      - name: Upload and deploy over SSH
        timeout-minutes: 50
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo '::error::Invalid SSH_HOST'; exit 1; }
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo '::error::Invalid SSH_USER'; exit 1; }
          test -n "$SSH_PRIVATE_KEY" || { echo '::error::SSH_PRIVATE_KEY is empty'; exit 1; }
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if [ -n "$SSH_KNOWN_HOSTS" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
            host_check=yes
          else
            host_check=accept-new
          fi
          opts=(-i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -o StrictHostKeyChecking="$host_check")
          target="${SSH_USER}@${SSH_HOST}"
          stage="/tmp/boxmytelevison-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            ssh "${opts[@]}" "$target" "rm -f '$stage/app.tar.gz' '$stage/app.tar.gz.sha256' '$stage/deploy.sh'; rmdir '$stage' 2>/dev/null || true" || true
            rm -f "$HOME/.ssh/deploy_key" app.tar.gz .next/standalone/password.json
          }
          trap cleanup EXIT
          # Check runtime and permissions before spending time uploading.
          ssh "${opts[@]}" "$target" 'set -e; test "$(uname -m)" = x86_64 || { echo "This build requires an x86_64 server"; exit 1; }; command -v curl; command -v sha256sum; command -v tar; command -v xz; command -v systemctl; if [ "$(id -u)" != 0 ]; then sudo -n true; fi'
          ssh "${opts[@]}" "$target" "umask 077; mkdir -p '$stage'"
          uploaded=0
          for attempt in 1 2 3; do
            if timeout 15m scp "${opts[@]}" app.tar.gz app.tar.gz.sha256 deploy/deploy.sh "$target:$stage/"; then
              uploaded=1
              break
            fi
            echo "Upload attempt $attempt failed; retrying..."
          done
          test "$uploaded" = 1 || { echo '::error::Upload failed'; exit 1; }
          ssh "${opts[@]}" "$target" "bash '$stage/deploy.sh' '$stage' '$APP_DIR'"

      - name: Remove local deployment credentials
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key" app.tar.gz .next/standalone/password.json
