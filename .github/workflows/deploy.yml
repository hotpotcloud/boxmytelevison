name: Deploy to Tencent Cloud

# 推送到 main 时自动部署；也支持在 Actions 页面手动触发
on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时刻只允许一个部署任务，避免并发互相覆盖
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: write   # 允许创建/更新滚动 Release 产物

env:
  APP_DIR: /opt/boxmytelevison
  DIST_TAG: dist

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          DOCKER_BUILD: "1"
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Package standalone
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
          tar -czf app.tar.gz -C .next/standalone .

      - name: Publish rolling release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.DIST_TAG }}
          name: Rolling build
          artifacts: app.tar.gz
          allowUpdates: true
          replacesArtifacts: true
          removeArtifacts: true
          prerelease: false

      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          APP_DIR: ${{ env.APP_DIR }}
          DIST_TAG: ${{ env.DIST_TAG }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          envs: APP_PASSWORD,APP_DIR,DIST_TAG
          script: |
            set -e
            BASE="https://raw.githubusercontent.com/hotpotcloud/boxmytelevison/main/deploy"
            REL="https://github.com/hotpotcloud/boxmytelevison/releases/download/${DIST_TAG}/app.tar.gz"

            mkdir -p "$APP_DIR"
            cd /tmp

            # 1) 服务器直接从 GitHub 下载构建产物（避开跨境 SSH 上传）
            curl -fsSL --retry 3 -o app.tar.gz "$REL"
            curl -fsSL --retry 3 -o server.env "$BASE/server.env"
            curl -fsSL --retry 3 -o start.sh "$BASE/start.sh"

            # 2) 解压新版本
            tar -xzf app.tar.gz -C "$APP_DIR"

            # 3) 生成应用配置（预置源 + 访问密码）
            cp server.env "$APP_DIR/.env"
            echo "PASSWORD=${APP_PASSWORD}" >> "$APP_DIR/.env"

            # 4) 启动脚本
            cp start.sh "$APP_DIR/start.sh"
            chmod +x "$APP_DIR/start.sh"

            # 5) 注册 systemd 服务（首次），随后重启
            cat > /etc/systemd/system/boxmytelevison.service <<EOF
            [Unit]
            Description=BoxMyTelevision
            After=network.target

            [Service]
            Type=simple
            WorkingDirectory=$APP_DIR
            ExecStart=$APP_DIR/start.sh
            Restart=on-failure
            RestartSec=5

            [Install]
            WantedBy=multi-user.target
            EOF
            systemctl daemon-reload
            systemctl enable boxmytelevison
            systemctl restart boxmytelevison

            sleep 3
            echo "===== 服务状态 ====="
            systemctl is-active boxmytelevison
            echo "===== 本机自检 ====="
            curl -sI http://127.0.0.1:8080 | head -1 || true
